<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Resident Profile</title>
<link rel="stylesheet" th:href="@{/css/style.css}"></head><body>
<nav class="topbar"><b>E-Barangay</b><a href="/">Dashboard</a><a href="/residents">Residents</a><a href="/documents">Documents</a><a href="/blotter">Blotter</a></nav>
<a href="/residents">&larr; Back</a> | <a th:href="@{/residents/edit/{id}(id=${r.id})}">Edit</a>
<h2 th:text="${r.fullname}"></h2>
<table class="info">
<tr><td>ID</td><td th:text="${r.id}"></td></tr>
<tr><td>Status</td><td th:text="${r.status}"></td></tr>
<tr><td>Category</td><td th:text="${r.category}"></td></tr>
<tr><td>Disability type</td><td th:text="${r.disabilityType}"></td></tr>
<tr><td>PWD ID number</td><td th:text="${r.pwdIdNumber}"></td></tr>
<tr><td>Age</td><td><span th:text="${r.age}"></span><b th:if="${r.age != null and r.age >= 60}"> (Senior)</b></td></tr>
<tr><td>Purok</td><td th:text="${r.purok}"></td></tr>
<tr><td>Address</td><td th:text="${r.address}"></td></tr>
<tr><td>Contact</td><td th:text="${r.contact}"></td></tr>
<tr><td>Birthdate</td><td th:text="${r.birthdate}"></td></tr>
<tr><td>Sex</td><td th:text="${r.sex}"></td></tr>
<tr><td>Civil status</td><td th:text="${r.civilStatus}"></td></tr>
<tr><td>Occupation</td><td th:text="${r.occupation}"></td></tr>
</table>
<h3>Documents</h3>
<div class="wrap"><table><tr><th>ID</th><th>Type</th><th>Purpose</th><th>Date</th></tr>
<tr th:each="d : ${docs}"><td th:text="${d.id}"></td><td th:text="${d.docType}"></td><td th:text="${d.purpose}"></td><td th:text="${d.dateIssued}"></td></tr></table></div>
<h3>Blotter records (as complainant)</h3>
<div class="wrap"><table><tr><th>ID</th><th>Respondent</th><th>Type</th><th>Date</th></tr>
<tr th:each="b : ${blotters}"><td th:text="${b.id}"></td><td th:text="${b.respondentName}"></td><td th:text="${b.incidentType}"></td><td th:text="${b.dateFiled}"></td></tr></table></div>
</body></html>
