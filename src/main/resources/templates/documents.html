<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta name="viewport" content="width=device-width, initial-scale=1"><title>Documents</title>
<style>body{font-family:sans-serif;padding:15px} input,select,button{padding:8px;margin:4px} table{width:100%;border-collapse:collapse;margin-top:15px} th,td{border:1px solid #ccc;padding:8px} td button{margin:0} td form{margin:0;display:inline} td a{margin-right:6px}</style>
</head><body><a href="/">Home</a><h2>Document Request</h2>
<form action="/documents/add" method="post">
<select name="residentId" required><option value="">Select Resident</option><option th:each="r:${residents}" th:value="${r.id}" th:text="${r.fullname}"></option></select>
<select name="docType"><option>Barangay Clearance</option><option>Indigency</option><option>Residency</option></select>
<input name="purpose" placeholder="Purpose">
<input name="orNumber" placeholder="OR Number"><input name="amountPaid" placeholder="Amount Paid">
<label>Valid until <input name="validUntil" type="date"></label>
<button>Issue</button>
</form>
<table><tr><th>ID</th><th>ResidentID</th><th>Type</th><th>Purpose</th><th>Date</th><th>Status</th><th>QR</th><th>Action</th></tr>
<tr th:each="d:${docs}"><td th:text="${d.id}"></td><td th:text="${d.residentId}"></td><td th:text="${d.docType}"></td><td th:text="${d.purpose}"></td><td th:text="${d.dateIssued}"></td><td th:text="${d.status}"></td><td><a th:href="@{'/qr/DOC-'+${d.id}}">QR Verify</a></td>
<td><a th:href="@{/documents/edit/{id}(id=${d.id})}">Edit</a>
<form th:action="@{/documents/delete/{id}(id=${d.id})}" method="post" onsubmit="return confirm('Delete this document?');"><button type="submit">Delete</button></form></td></tr>
</table></body></html>
