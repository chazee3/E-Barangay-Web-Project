<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Documents - E-Barangay</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .navbar-custom { background-color: #14532d; }
        .btn-custom { background-color: #15803d; color: white; }
        .btn-custom:hover { background-color: #166534; color: white; }
        .table-custom thead { background-color: #15803d; color: white; }
    </style>
</head>
<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark navbar-custom px-4">
    <a class="navbar-brand fw-bold" href="/">E-Barangay</a>
    <div class="navbar-nav ms-auto">
        <a class="nav-link" href="/">Dashboard</a>
        <a class="nav-link" href="/residents">Residents</a>
        <a class="nav-link active" href="/documents">Documents</a>
        <a class="nav-link" href="/blotter">Barangay Blotter</a>
        <a class="nav-link text-warning" href="/logout">Logout</a>
    </div>
</nav>

<div class="container my-4">
    <h3 class="fw-bold mb-4">Document Issuance</h3>

    <!-- ADD DOCUMENT FORM (TEXTFIELD WITH INSTANT SEARCH) -->
    <div class="card p-3 mb-4 shadow-sm border-0">
        <form th:action="@{/documents/add}" method="post">
            <div class="row g-2 mb-2">
                <!-- Textfield with Datalist Autocomplete -->
                <div class="col-md-4">
                    <input list="residentList" type="text" name="requester" class="form-control" placeholder="Requester Name *" required autocomplete="off">
                    <datalist id="residentList">
                        <option th:each="res : ${residents}" th:value="${res.fullname}"></option>
                    </datalist>
                </div>
                <div class="col-md-4">
                    <input type="text" name="contact" class="form-control" placeholder="Contact No. (optional)">
                </div>
                <div class="col-md-4">
                    <select name="docType" class="form-select" required>
                        <option value="">Select Document Type *</option>
                        <option value="Barangay Clearance">Barangay Clearance</option>
                        <option value="Sedula">Sedula</option>
                        <option value="Purok Clearance">Purok Clearance</option>
                        <option value="Purok Certification">Purok Certification</option>
                        <option value="Low Income Certificate">Low Income Certificate</option>
                        <option value="Others">Others</option>
                    </select>
                </div>
            </div>

            <div class="row g-2 mb-3">
                <div class="col-md-8">
                    <input type="text" name="purpose" class="form-control" placeholder="Purpose (e.g. Employment, Scholarship, Local requirement)">
                </div>
                <div class="col-md-4">
                    <input type="date" name="validUntil" class="form-control" placeholder="Valid Until">
                </div>
            </div>

            <button type="submit" class="btn btn-custom px-4">Issue Document</button>
        </form>
    </div>

    <!-- DOCUMENTS TABLE -->
    <div class="table-responsive">
        <table class="table table-hover table-bordered align-middle shadow-sm bg-white">
            <thead class="table-custom">
                <tr>
                    <th>ID</th>
                    <th>Resident / Requester</th>
                    <th>Document Type</th>
                    <th>Purpose</th>
                    <th>Date Issued</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="d : ${docs}">
                    <td th:text="${d.id}">1</td>
                    <td class="fw-bold" th:text="${d.requester != null ? d.requester : (names[d.residentId] != null ? names[d.residentId] : 'Resident #' + d.residentId)}">Requester</td>
                    <td th:text="${d.docType}">Barangay Clearance</td>
                    <td th:text="${d.purpose != null ? d.purpose : '-'}">-</td>
                    <td th:text="${d.dateIssued}">2026-11-06</td>
                    <td>
                        <span th:if="${d.status == 'Released'}" class="badge bg-success">Released</span>
                        <span th:if="${d.status == 'Issued'}" class="badge bg-primary">Issued</span>
                        <span th:if="${d.status == 'Pending'}" class="badge bg-warning text-dark">Pending</span>
                        <span th:if="${d.status == 'Expired'}" class="badge bg-danger">Expired</span>
                        <span th:unless="${d.status == 'Released' or d.status == 'Issued' or d.status == 'Pending' or d.status == 'Expired'}" 
                              class="badge bg-secondary" th:text="${d.status}">Status</span>
                    </td>
                    <td>
                        <a th:href="@{'/documents/view/' + ${d.id}}" class="btn btn-sm btn-outline-secondary">View</a>
                        <a th:href="@{'/documents/edit/' + ${d.id}}" class="btn btn-sm btn-outline-primary">Edit</a>
                        <form th:action="@{'/documents/delete/' + ${d.id}}" method="post" class="d-inline" onsubmit="return confirm('Delete this record?');">
                            <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
