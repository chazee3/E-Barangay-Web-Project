<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Residents - E-Barangay</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .navbar-custom { background-color: #14532d; }
        .btn-custom { background-color: #15803d; color: white; }
        .btn-custom:hover { background-color: #166534; color: white; }
        .table-custom thead { background-color: #15803d; color: white; }
    </style>
</head>
<body class="bg-light">

<!-- Navbar with Logout -->
<nav class="navbar navbar-expand-lg navbar-dark navbar-custom px-4">
    <a class="navbar-brand fw-bold" href="/">E-Barangay</a>
    <div class="navbar-nav ms-auto">
        <a class="nav-link" href="/">Dashboard</a>
        <a class="nav-link active" href="/residents">Residents</a>
        <a class="nav-link" href="/documents">Documents</a>
        <a class="nav-link" href="/blotter">Blotter</a>
        <a class="nav-link text-warning" href="/logout">Logout</a>
    </div>
</nav>

<div class="container my-4">
    <h3 class="fw-bold mb-4">Resident Profiling</h3>

    <!-- ADD RESIDENT FORM -->
    <div class="card p-3 mb-4 shadow-sm border-0">
        <form th:action="@{/residents/add}" method="post">
            <div class="row g-2 mb-2">
                <div class="col-md-3">
                    <input type="text" name="firstName" class="form-control" placeholder="First Name *" required>
                </div>
                <div class="col-md-3">
                    <input type="text" name="middleName" class="form-control" placeholder="Middle Name">
                </div>
                <div class="col-md-3">
                    <input type="text" name="lastName" class="form-control" placeholder="Last Name *" required>
                </div>
                <div class="col-md-3">
                    <input type="text" name="extension" class="form-control" placeholder="Extension (Jr, Sr, III)">
                </div>
            </div>

            <div class="row g-2 mb-2">
                <div class="col-md-4">
                    <input type="text" name="address" class="form-control" placeholder="Address">
                </div>
                <div class="col-md-4">
                    <input type="text" name="contact" class="form-control" placeholder="Contact">
                </div>
                <div class="col-md-4">
                    <input type="date" name="birthdate" class="form-control" placeholder="Birthdate">
                </div>
            </div>

            <div class="row g-2 mb-3">
                <div class="col-md-2">
                    <select name="sex" class="form-select">
                        <option value="">Sex</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <select name="civilStatus" class="form-select">
                        <option value="">Civil Status</option>
                        <option value="Single">Single</option>
                        <option value="Married">Married</option>
                        <option value="Widowed">Widowed</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <select name="category" class="form-select">
                        <option value="">Category</option>
                        <option value="PWD">PWD</option>
                        <option value="Senior Citizen">Senior Citizen</option>
                        <option value="Solo Parent">Solo Parent</option>
                        <option value="Youth">Youth</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <input type="text" name="disabilityType" class="form-control" placeholder="Disability type (if PWD)">
                </div>
                <div class="col-md-3">
                    <input type="text" name="occupation" class="form-control" placeholder="Occupation">
                </div>
            </div>

            <button type="submit" class="btn btn-custom px-4">Add Resident</button>
        </form>
    </div>

    <!-- SEARCH FILTER -->
    <div class="row g-2 mb-3">
        <div class="col-md-6">
            <form th:action="@{/residents}" method="get" class="d-flex gap-2">
                <input type="text" name="q" th:value="${q}" class="form-control" placeholder="Search name, address, contact">
                <button type="submit" class="btn btn-success">Search</button>
                <a href="/residents" class="btn btn-outline-secondary">Clear</a>
            </form>
        </div>
    </div>

    <!-- RESIDENTS TABLE (NO QR COLUMN) -->
    <p class="text-muted small" th:text="${#lists.size(residents)} + ' resident(s)'">0 residents</p>
    <div class="table-responsive">
        <table class="table table-hover table-bordered align-middle shadow-sm bg-white">
            <thead class="table-custom">
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Address</th>
                    <th>Contact</th>
                    <th>Category</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="r : ${residents}">
                    <td th:text="${r.id}">1</td>
                    <td class="fw-bold" th:text="${r.fullname}">Juan Dela Cruz</td>
                    <td th:text="${r.address != null ? r.address : '-'}">-</td>
                    <td th:text="${r.contact}">09123456789</td>
                    <td th:text="${r.category != null ? r.category : '-'}">-</td>
                    <td>
                        <span class="badge bg-success" th:if="${r.status == 'Active'}">Active</span>
                        <span class="badge bg-secondary" th:unless="${r.status == 'Active'}" th:text="${r.status}">Inactive</span>
                    </td>
                    <td>
                        <a th:href="@{'/residents/view/' + ${r.id}}" class="btn btn-sm btn-outline-secondary">View</a>
                        <a th:href="@{'/residents/edit/' + ${r.id}}" class="btn btn-sm btn-outline-primary">Edit</a>
                        <form th:action="@{'/residents/delete/' + ${r.id}}" method="post" class="d-inline" onsubmit="return confirm('Delete this resident?');">
                            <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
