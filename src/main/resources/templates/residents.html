<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta name="viewport" content="width=device-width, initial-scale=1"><title>Residents</title>
<style>body{font-family:sans-serif;padding:15px} input,button{padding:8px;margin:4px} table{width:100%;border-collapse:collapse;margin-top:15px} th,td{border:1px solid #ccc;padding:8px}</style>
</head><body><a href="/">Home</a><h2>Resident Profiling</h2>
<form action="/residents/add" method="post">
<input name="fullname" placeholder="Fullname" required><input name="purok" placeholder="Purok"><input name="contact" placeholder="Contact"><input name="birthdate" type="date"><button>Add</button>
</form>
<table><tr><th>ID</th><th>Name</th><th>Purok</th><th>Contact</th><th>QR</th></tr>
<tr th:each="r : ${residents}"><td th:text="${r.id}"></td><td th:text="${r.fullname}"></td><td th:text="${r.purok}"></td><td th:text="${r.contact}"></td><td><a th:href="@{'/qr/BRGY-'+${r.id}}">QR</a></td></tr>
</table></body></html>
