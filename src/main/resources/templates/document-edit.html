<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Edit Document</title>
<link rel="stylesheet" th:href="@{/css/style.css}"></head><body>
<nav class="topbar"><b>E-Barangay</b><a href="/">Dashboard</a><a href="/residents">Residents</a><a href="/documents">Documents</a><a href="/blotter">Blotter</a></nav>
<a href="/documents">&larr; Back</a><h2>Edit Document</h2>
<p class="muted">Resident: <b th:text="${residentName}"></b> | Control No.: <b th:text="${d.controlNo}"></b></p>
<form th:action="@{/documents/update/{id}(id=${d.id})}" method="post">
<label>Document type</label><select name="docType"><option th:selected="${d.docType == 'Barangay Clearance'}">Barangay Clearance</option><option th:selected="${d.docType == 'Indigency'}">Indigency</option><option th:selected="${d.docType == 'Residency'}">Residency</option><option th:selected="${d.docType == 'Good Moral'}">Good Moral</option><option th:selected="${d.docType == 'Business Clearance'}">Business Clearance</option></select>
<label>Purpose</label><input name="purpose" th:value="${d.purpose}">
<label>Status</label><select name="status"><option th:selected="${d.status == 'Issued'}">Issued</option><option th:selected="${d.status == 'Released'}">Released</option><option th:selected="${d.status == 'Expired'}">Expired</option></select>
<label>Valid until</label><input name="validUntil" type="date" min="2020-01-01" max="2100-12-31" th:value="${d.validUntil}">
<label>OR number</label><input name="orNumber" th:value="${d.orNumber}">
<label>Amount paid</label><input name="amountPaid" th:value="${d.amountPaid}">
<button type="submit">Save</button>
</form></body></html>
