<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta name="viewport" content="width=device-width, initial-scale=1"><title>Edit Resident</title>
<style>body{font-family:sans-serif;padding:15px;max-width:500px} label{display:block;margin-top:10px;font-weight:bold} input,select{padding:8px;width:100%;box-sizing:border-box;margin-top:4px} button{padding:10px 16px;margin-top:15px}</style>
</head><body><a href="/residents">Back</a><h2>Edit Resident</h2>
<form th:action="@{/residents/update/{id}(id=${r.id})}" method="post">
<label>Full name</label><input name="fullname" th:value="${r.fullname}" required>
<label>Purok</label><input name="purok" th:value="${r.purok}">
<label>Contact</label><input name="contact" th:value="${r.contact}">
<label>Birthdate</label><input name="birthdate" type="date" th:value="${r.birthdate}">
<label>Address</label><input name="address" th:value="${r.address}">
<label>Sex</label><select name="sex"><option value="">-</option><option th:selected="${r.sex == 'Male'}">Male</option><option th:selected="${r.sex == 'Female'}">Female</option></select>
<label>Civil status</label><select name="civilStatus"><option value="">-</option><option th:selected="${r.civilStatus == 'Single'}">Single</option><option th:selected="${r.civilStatus == 'Married'}">Married</option><option th:selected="${r.civilStatus == 'Widowed'}">Widowed</option><option th:selected="${r.civilStatus == 'Separated'}">Separated</option></select>
<label>Category</label><select name="category"><option value="">None</option><option th:selected="${r.category == 'Senior Citizen'}">Senior Citizen</option><option th:selected="${r.category == 'PWD'}">PWD</option><option th:selected="${r.category == 'Solo Parent'}">Solo Parent</option><option th:selected="${r.category == '4Ps'}">4Ps</option></select>
<label>Disability type (if PWD)</label><select name="disabilityType"><option value="">-</option><option th:selected="${r.disabilityType == 'Visual'}">Visual</option><option th:selected="${r.disabilityType == 'Hearing'}">Hearing</option><option th:selected="${r.disabilityType == 'Speech'}">Speech</option><option th:selected="${r.disabilityType == 'Physical'}">Physical</option><option th:selected="${r.disabilityType == 'Intellectual'}">Intellectual</option><option th:selected="${r.disabilityType == 'Psychosocial'}">Psychosocial</option><option th:selected="${r.disabilityType == 'Learning'}">Learning</option><option th:selected="${r.disabilityType == 'Chronic illness'}">Chronic illness</option><option th:selected="${r.disabilityType == 'Others'}">Others</option></select>
<label>PWD ID number</label><input name="pwdIdNumber" th:value="${r.pwdIdNumber}">
<label>Status</label><select name="status"><option th:selected="${r.status == 'Active'}">Active</option><option th:selected="${r.status == 'Transferred'}">Transferred</option><option th:selected="${r.status == 'Deceased'}">Deceased</option></select>
<label>Occupation</label><input name="occupation" th:value="${r.occupation}">
<button type="submit">Save</button>
</form></body></html>
