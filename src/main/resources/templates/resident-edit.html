<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit Resident - E-Barangay</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .navbar-custom { background-color: #14532d; }
        .btn-custom { background-color: #15803d; color: white; }
        .btn-custom:hover { background-color: #166534; color: white; }
    </style>
</head>
<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark navbar-custom px-4">
    <a class="navbar-brand fw-bold" href="/">E-Barangay</a>
    <div class="navbar-nav ms-auto">
        <a class="nav-link" href="/">Dashboard</a>
        <a class="nav-link active" href="/residents">Residents</a>
        <a class="nav-link" href="/documents">Documents</a>
        <a class="nav-link" href="/blotter">Barangay Blotter</a>
        <a class="nav-link text-warning" href="/logout">Logout</a>
    </div>
</nav>

<div class="container my-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="fw-bold text-success mb-0" th:text="'Edit Resident: ' + ${r.fullname}">Edit Resident</h3>
        <a href="/residents" class="btn btn-outline-secondary btn-sm">&larr; Back to Residents</a>
    </div>

    <div class="card p-4 shadow-sm border-0 bg-white">
        <form th:action="@{'/residents/update/' + ${r.id}}" method="post">
            <h5 class="fw-bold text-dark mb-3">Personal Information</h5>
            
            <div class="row g-3 mb-3">
                <div class="col-md-3">
                    <label class="form-label fw-semibold text-muted">First Name *</label>
                    <input type="text" name="firstName" th:value="${r.firstName != null ? r.firstName : r.fullname}" class="form-control" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-semibold text-muted">Middle Name</label>
                    <input type="text" name="middleName" th:value="${r.middleName}" class="form-control">
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-semibold text-muted">Last Name *</label>
                    <input type="text" name="lastName" th:value="${r.lastName != null ? r.lastName : ''}" class="form-control" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-semibold text-muted">Extension</label>
                    <input type="text" name="extension" th:value="${r.extension}" class="form-control" placeholder="Jr., Sr., III">
                </div>
            </div>

            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label fw-semibold text-muted">Address</label>
                    <input type="text" name="address" th:value="${r.address}" class="form-control">
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-semibold text-muted">Contact Number</label>
                    <input type="text" name="contact" th:value="${r.contact}" class="form-control">
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-semibold text-muted">Birthdate</label>
                    <input type="date" name="birthdate" th:value="${r.birthdate}" class="form-control">
                </div>
            </div>

            <div class="row g-3 mb-4">
                <div class="col-md-2">
                    <label class="form-label fw-semibold text-muted">Sex</label>
                    <select name="sex" class="form-select">
                        <option value="Male" th:selected="${r.sex == 'Male'}">Male</option>
                        <option value="Female" th:selected="${r.sex == 'Female'}">Female</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label fw-semibold text-muted">Civil Status</label>
                    <select name="civilStatus" class="form-select">
                        <option value="Single" th:selected="${r.civilStatus == 'Single'}">Single</option>
                        <option value="Married" th:selected="${r.civilStatus == 'Married'}">Married</option>
                        <option value="Widowed" th:selected="${r.civilStatus == 'Widowed'}">Widowed</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label fw-semibold text-muted">Category</label>
                    <select name="category" class="form-select">
                        <option value="" th:selected="${r.category == null or r.category == ''}">Regular</option>
                        <option value="PWD" th:selected="${r.category == 'PWD'}">PWD</option>
                        <option value="Senior Citizen" th:selected="${r.category == 'Senior Citizen'}">Senior Citizen</option>
                        <option value="Solo Parent" th:selected="${r.category == 'Solo Parent'}">Solo Parent</option>
                        <option value="Youth" th:selected="${r.category == 'Youth'}">Youth</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label fw-semibold text-muted">Disability (if PWD)</label>
                    <input type="text" name="disabilityType" th:value="${r.disabilityType}" class="form-control">
                </div>
                <div class="col-md-2">
                    <label class="form-label fw-semibold text-muted">Occupation</label>
                    <input type="text" name="occupation" th:value="${r.occupation}" class="form-control">
                </div>
                <div class="col-md-2">
                    <label class="form-label fw-semibold text-muted">Status</label>
                    <select name="status" class="form-select">
                        <option value="Active" th:selected="${r.status == 'Active'}">Active</option>
                        <option value="Inactive" th:selected="${r.status == 'Inactive'}">Inactive</option>
                    </select>
                </div>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-custom px-4">Save Changes</button>
                <a href="/residents" class="btn btn-outline-secondary px-3">Cancel</a>
            </div>
        </form>
    </div>
</div>

</body>
</html>
