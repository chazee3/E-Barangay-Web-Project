<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - E-Barangay</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f0fdf4; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .login-card { width: 100%; max-width: 400px; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); background: #fff; border: 1px solid #dcfce7; }
        .btn-green { background-color: #15803d; color: white; }
        .btn-green:hover { background-color: #166534; color: white; }
    </style>
</head>
<body>

<div class="login-card">
    <div class="text-center mb-4">
        <h2 class="fw-bold text-success">E-Barangay</h2>
        <p class="text-muted">Officials Login</p>
    </div>

    <div th:if="${param.error}" class="alert alert-danger py-2">Invalid username or password.</div>
    <div th:if="${param.logout}" class="alert alert-success py-2">You have been logged out.</div>

    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label class="form-label text-muted">Username</label>
            <input type="text" name="username" class="form-control" required autofocus>
        </div>

        <div class="mb-4">
            <label class="form-label text-muted">Password</label>
            <div class="input-group">
                <input type="password" id="passwordField" name="password" class="form-control" required>
                <button class="btn btn-outline-secondary" type="button" id="togglePasswordBtn" title="Toggle password visibility">
                    👁️
                </button>
            </div>
        </div>

        <button type="submit" class="btn btn-green w-100 py-2">Log in</button>
    </form>
</div>

<script>
    const toggleBtn = document.getElementById('togglePasswordBtn');
    const pwdInput = document.getElementById('passwordField');

    toggleBtn.addEventListener('click', function () {
        const isPassword = pwdInput.getAttribute('type') === 'password';
        pwdInput.setAttribute('type', isPassword ? 'text' : 'password');
        toggleBtn.textContent = isPassword ? '🙈' : '👁️';
    });
</script>
</body>
</html>
