<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Barangay Blotter - E-Barangay</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .navbar-custom { background-color: #14532d; }
        .btn-custom { background-color: #15803d; color: white; }
        .btn-custom:hover { background-color: #166534; color: white; }
        .table-custom thead { background-color: #15803d; color: white; }
    </style>
</head>
<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark navbar-custom px-4">
    <a class="navbar-brand fw-bold" href="/">E-Barangay</a>
    <div class="navbar-nav ms-auto">
        <a class="nav-link" href="/">Dashboard</a>
        <a class="nav-link" href="/residents">Residents</a>
        <a class="nav-link" href="/documents">Documents</a>
        <a class="nav-link active" href="/blotter">Barangay Blotter</a>
        <a class="nav-link text-warning" href="/logout">Logout</a>
    </div>
</nav>

<div class="container my-4">
    <h3 class="fw-bold mb-4">Barangay Blotter Log</h3>

    <!-- FILE BLOTTER FORM -->
    <div class="card p-3 mb-4 shadow-sm border-0">
        <form th:action="@{/blotter/add}" method="post">
            <div class="row g-2 mb-2">
                <div class="col-md-3">
                    <input list="complainantList" type="text" name="complainant" class="form-control" placeholder="Complainant Name *" required autocomplete="off">
                    <datalist id="complainantList">
                        <option th:each="res : ${residents}" th:value="${res.fullname}"></option>
                    </datalist>
                </div>
                <div class="col-md-3">
                    <input type="text" name="contact" class="form-control" placeholder="Contact No. (optional)">
                </div>
                <div class="col-md-3">
                    <input type="text" name="respondentName" class="form-control" placeholder="Respondent *" required>
                </div>
                <div class="col-md-3">
                    <input list="complainOptions" name="incidentType" class="form-control" placeholder="Complain *" required>
                    <datalist id="complainOptions">
                        <option value="Away Kapitbahay">
                        <option value="Ingay">
                        <option value="Utang">
                        <option value="Pagnanakaw / Theft">
                        <option value="Physical Injury">
                        <option value="Boundary Dispute">
                        <option value="Others">
                    </datalist>
                </div>
            </div>

            <div class="row g-2 mb-2">
                <!-- CLEARLY LABELED DATES (No more mystery mm/dd/yyyy boxes) -->
                <div class="col-md-3">
                    <div class="input-group">
                        <span class="input-group-text small bg-white text-muted">Incident Date</span>
                        <input type="date" name="incidentDate" class="form-control">
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="input-group">
                        <span class="input-group-text small bg-white text-muted">Hearing Date</span>
                        <input type="date" name="hearingDate" class="form-control">
                    </div>
                </div>
                <div class="col-md-3">
                    <input type="text" name="incidentPlace" class="form-control" placeholder="Incident Place">
                </div>
                <div class="col-md-3">
                    <input type="text" name="witnesses" class="form-control" placeholder="Witnesses">
                </div>
            </div>

            <div class="mb-3">
                <textarea name="details" class="form-control" rows="3" placeholder="Details of the incident..."></textarea>
            </div>

            <button type="submit" class="btn btn-custom px-4">File Blotter</button>
        </form>
    </div>

    <!-- BLOTTER TABLE -->
    <div class="table-responsive">
        <table class="table table-hover table-bordered align-middle shadow-sm bg-white">
            <thead class="table-custom">
                <tr>
                    <th>Case No.</th>
                    <th>Complainant</th>
                    <th>Respondent</th>
                    <th>Complain</th>
                    <th>Filed</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="b : ${blotters}">
                    <td class="fw-bold" th:text="${b.caseNo != null ? b.caseNo : 'BLT-' + b.id}">BLT-0001</td>
                    <td th:text="${b.complainant != null ? b.complainant : (names[b.complainantId] != null ? names[b.complainantId] : 'Complainant #' + b.complainantId)}">Complainant</td>
                    <td th:text="${b.respondentName}">Respondent</td>
                    <td th:text="${b.incidentType}">Complain</td>
                    <td th:text="${b.dateFiled}">2026-11-06</td>
                    <td>
                        <span class="badge bg-warning text-dark" th:if="${b.status == 'Pending'}">Pending</span>
                        <span class="badge bg-success" th:if="${b.status == 'Settled'}">Settled</span>
                        <span class="badge bg-danger" th:if="${b.status == 'Escalated'}">Escalated</span>
                        <span class="badge bg-secondary" th:if="${b.status == 'Dismissed'}">Dismissed</span>
                    </td>
                    <td>
                        <a th:href="@{'/blotter/view/' + ${b.id}}" class="btn btn-sm btn-outline-secondary">View</a>
                        <a th:href="@{'/blotter/edit/' + ${b.id}}" class="btn btn-sm btn-outline-primary">Edit</a>
                        <form th:action="@{'/blotter/delete/' + ${b.id}}" method="post" class="d-inline" onsubmit="return confirm('Delete this record?');">
                            <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
