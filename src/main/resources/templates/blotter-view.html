<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Blotter Details</title>
<link rel="stylesheet" th:href="@{/css/style.css}"></head><body>
<nav class="topbar"><b>E-Barangay</b><a href="/">Dashboard</a><a href="/residents">Residents</a><a href="/documents">Documents</a><a href="/blotter">Blotter</a></nav>
<a href="/blotter">&larr; Back</a> | <a th:href="@{/blotter/edit/{id}(id=${b.id})}">Edit</a> | <a href="#" onclick="window.print();return false;">Print</a>
<h2>Blotter Case <span th:text="${b.caseNo}"></span></h2>
<table class="info">
<tr><td>Complainant</td><td th:text="${complainant}"></td></tr>
<tr><td>Respondent</td><td th:text="${b.respondentName}"></td></tr>
<tr><td>Incident type</td><td th:text="${b.incidentType}"></td></tr>
<tr><td>Incident date</td><td th:text="${b.incidentDate}"></td></tr>
<tr><td>Incident place</td><td th:text="${b.incidentPlace}"></td></tr>
<tr><td>Witnesses</td><td th:text="${b.witnesses}"></td></tr>
<tr><td>Date filed</td><td th:text="${b.dateFiled}"></td></tr>
<tr><td>Hearing date</td><td th:text="${b.hearingDate}"></td></tr>
<tr><td>Status</td><td th:text="${b.status}"></td></tr>
<tr><td>Details</td><td th:text="${b.details}"></td></tr>
<tr><td>Resolution notes</td><td th:text="${b.resolution}"></td></tr>
</table></body></html>
