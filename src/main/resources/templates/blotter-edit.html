<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit Blotter - E-Barangay</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .navbar-custom { background-color: #14532d; }
        .btn-custom { background-color: #15803d; color: white; }
        .btn-custom:hover { background-color: #166534; color: white; }
    </style>
</head>
<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark navbar-custom px-4">
    <a class="navbar-brand fw-bold" href="/">E-Barangay</a>
    <div class="navbar-nav ms-auto">
        <a class="nav-link" href="/">Dashboard</a>
        <a class="nav-link" href="/residents">Residents</a>
        <a class="nav-link" href="/documents">Documents</a>
        <a class="nav-link active" href="/blotter">Barangay Blotter</a>
        <a class="nav-link text-warning" href="/logout">Logout</a>
    </div>
</nav>

<div class="container my-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h3 class="fw-bold text-success mb-1">Edit Blotter</h3>
            <p class="text-muted mb-0">Case No.: <b th:text="${b.caseNo != null ? b.caseNo : 'BLT-' + b.id}">BLT-0001</b></p>
        </div>
        <a href="/blotter" class="btn btn-outline-secondary btn-sm">&larr; Back to Blotter</a>
    </div>

    <div class="card p-4 shadow-sm border-0 bg-white">
        <form th:action="@{'/blotter/update/' + ${b.id}}" method="post">
            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label fw-semibold text-muted">Complainant Name *</label>
                    <input list="complainantList" type="text" name="complainant" th:value="${complainant}" class="form-control" required autocomplete="off">
                    <datalist id="complainantList">
                        <option th:each="res : ${residents}" th:value="${res.fullname}"></option>
                    </datalist>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold text-muted">Complainant Contact</label>
                    <input type="text" name="contact" th:value="${b.contact}" class="form-control">
                </div>
            </div>

            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label fw-semibold text-muted">Respondent Name *</label>
                    <input type="text" name="respondentName" th:value="${b.respondentName}" class="form-control" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold text-muted">Complain / Incident *</label>
                    <input list="complainOptions" name="incidentType" th:value="${b.incidentType}" class="form-control" placeholder="e.g. Away Kapitbahay, Utang" required>
                    <datalist id="complainOptions">
                        <option value="Away Kapitbahay">
                        <option value="Ingay">
                        <option value="Utang">
                        <option value="Pagnanakaw / Theft">
                        <option value="Physical Injury">
                        <option value="Boundary Dispute">
                        <option value="Others">
                    </datalist>
                </div>
            </div>

            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label fw-semibold text-muted">Incident Date</label>
                    <input type="date" name="incidentDate" th:value="${b.incidentDate}" class="form-control">
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold text-muted">Scheduled Hearing Date</label>
                    <input type="date" name="hearingDate" th:value="${b.hearingDate}" class="form-control">
                </div>
            </div>

            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label fw-semibold text-muted">Incident Place</label>
                    <input type="text" name="incidentPlace" th:value="${b.incidentPlace}" class="form-control">
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold text-muted">Witnesses</label>
                    <input type="text" name="witnesses" th:value="${b.witnesses}" class="form-control">
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold text-muted">Details</label>
                <textarea name="details" class="form-control" rows="3" th:text="${b.details}"></textarea>
            </div>

            <div class="row g-3 mb-4">
                <div class="col-md-6">
                    <label class="form-label fw-semibold text-muted">Status</label>
                    <select name="status" class="form-select">
                        <option value="Pending" th:selected="${b.status == 'Pending'}">Pending</option>
                        <option value="Settled" th:selected="${b.status == 'Settled'}">Settled</option>
                        <option value="Escalated" th:selected="${b.status == 'Escalated'}">Escalated</option>
                        <option value="Dismissed" th:selected="${b.status == 'Dismissed'}">Dismissed</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold text-muted">Resolution Notes</label>
                    <input type="text" name="resolution" th:value="${b.resolution}" class="form-control" placeholder="Resolution / Agreement">
                </div>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-custom px-4">Save Changes</button>
                <a href="/blotter" class="btn btn-outline-secondary px-3">Cancel</a>
            </div>
        </form>
    </div>
</div>

</body>
</html>
